version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      vitest:
        patterns: ['vitest', '@vitest/*']
      commitlint:
        patterns: ['@commitlint/*']
    ignore:
      # Node type majors decide which runtime APIs code may use; upgrade them with the supported
      # engine range (^22.22.1 || ^24.11.0 || >=26.0.0) instead of following the newest release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
