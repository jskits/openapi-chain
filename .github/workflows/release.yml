name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v<version> tag to publish (empty keeps the Changesets flow)'
        type: string
        required: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: '0'
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  select:
    # New scoped packages require bootstrap publication and per-package Trusted Publishers.
    # SCOPED_PUBLISH_ENABLED=true resumes the Changesets flow after that setup.
    # RELEASE_ENABLED=false remains an emergency stop.
    if: github.repository == 'jskits/openapi-chain' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.RELEASE_ENABLED != 'false' && vars.SCOPED_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.source.outputs.tag && 'publish' || steps.select.outputs.mode }}
      ref: ${{ steps.source.outputs.ref }}
      tag: ${{ steps.source.outputs.tag }}
      publish-plan: ${{ steps.select.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve and validate release source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag"; exit 1; }
            sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
            git merge-base --is-ancestor "$sha" origin/main
            package_path=packages/core/package.json
            if ! git cat-file -e "$sha:$package_path" 2>/dev/null; then
              package_path=package.json
            fi
            version=$(git show "$sha:$package_path" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            [[ "$RELEASE_TAG" == "v$version" ]] || { echo "Tag/package version mismatch"; exit 1; }
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            sha=$(git rev-parse HEAD)
          fi
          echo "ref=$sha" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: select
        if: steps.source.outputs.tag == ''

  version:
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The repository must also allow Actions to create pull requests;
      # job-level pull-requests: write does not enable that repository policy.
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: version
        with:
          script: pnpm version:packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
      - name: Dispatch validation for the version PR
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.version.outputs.pr-number }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const repository = process.env.GITHUB_REPOSITORY;
          const number = process.env.RELEASE_PR;
          if (!/^[1-9][0-9]*$/.test(number)) throw new Error('Invalid version PR number.');
          const pr = JSON.parse(execFileSync('gh', ['api', `repos/${repository}/pulls/${number}`], { encoding: 'utf8' }));
          if (pr.number !== Number(number) || pr.state !== 'open' || pr.base.ref !== 'main' || pr.base.repo.full_name !== repository || pr.head.repo.full_name !== repository || pr.head.ref !== 'changeset-release/main') {
            throw new Error('Unexpected version PR repository or branch.');
          }
          if (!/^[a-f0-9]{40}$/.test(pr.head.sha)) throw new Error('Invalid version PR commit.');
          const status = (state, description) => execFileSync('gh', ['api', '--method', 'POST', `repos/${repository}/statuses/${pr.head.sha}`,
            '-f', `state=${state}`, '-f', 'context=Release PR CI', '-f', `description=${description}`,
            '-f', `target_url=${process.env.GITHUB_SERVER_URL}/${repository}/actions/runs/${process.env.GITHUB_RUN_ID}`]);
          status('pending', 'Release PR validation queued');
          try {
            execFileSync('gh', ['workflow', 'run', 'release-pr-ci.yml', '--repo', repository,
              '--ref', pr.head.ref, '-f', `expected_sha=${pr.head.sha}`, '-f', `pr_number=${number}`], { stdio: 'inherit' });
          } catch (error) {
            try { status('error', 'Release PR validation dispatch failed'); }
            catch (statusError) { console.error('Could not report dispatch failure:', statusError); }
            throw error;
          }
          console.log(`Dispatched validation for release PR #${number} at ${pr.head.sha}`);
          NODE
      - name: Explain release PR failure recovery
        if: failure() && steps.version.outcome == 'failure'
        env:
          ACTIONS_SETTINGS_URL: ${{ github.server_url }}/${{ github.repository }}/settings/actions
        run: |
          {
            printf '### Release PR creation failed\n\n'
            printf 'Inspect the Changesets version step above for the original error.\n\n'
            printf 'If GitHub reports "GitHub Actions is not permitted to create or approve pull requests", enable **Allow GitHub Actions to create and approve pull requests** in [Settings → Actions → General](%s).\n\n' "$ACTIONS_SETTINGS_URL"
            printf 'Keep the default workflow token permissions read-only; this job already requests contents: write and pull-requests: write. If the setting is locked, an organization administrator must allow it.\n\n'
            printf 'After correcting the setting, rerun the failed jobs. A version bump or an npm token will not fix this permission error. No npm publication occurs in the version job.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: select
    if: needs.select.outputs.mode == 'publish'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.select.outputs.ref }}

  pack:
    needs: [select, verify]
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      packed: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.select.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Require the selected publish plan
        if: needs.select.outputs.tag == ''
        run: test -n "$PUBLISH_PLAN_ARTIFACT_ID"
        env:
          PUBLISH_PLAN_ARTIFACT_ID: ${{ needs.select.outputs.publish-plan }}
      - uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: pack
        with:
          publish-plan-artifact-id: ${{ needs.select.outputs.publish-plan }}

  publish:
    needs: [select, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    env:
      # Publish the packed artifact without running package lifecycle scripts.
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.select.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          # Do not set registry-url: OIDC needs no token-based .npmrc.
          package-manager-cache: false
      - name: Verify Trusted Publishing prerequisites
        shell: bash
        run: |
          # pnpm 10 delegates publishing tarballs to the npm CLI on PATH.
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = version.split('.').map(Number);
          if (!(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) {
            throw new Error(`npm >=11.5.1 is required for Trusted Publishing; found ${version}`);
          }
          for (const key of ['ACTIONS_ID_TOKEN_REQUEST_URL', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN', 'PACK_ARTIFACT_ID']) {
            if (!process.env[key]) throw new Error(`Missing ${key}`);
          }
          console.log(`Trusted Publishing prerequisites passed (npm ${version}).`);
          NODE
        env:
          PACK_ARTIFACT_ID: ${{ needs.pack.outputs.packed }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: publish
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.packed }}
          create-github-releases: ${{ needs.select.outputs.tag == '' }}
          push-git-tags: ${{ needs.select.outputs.tag == '' }}
      - name: Verify registry delivery and installed consumers
        id: verify_registry
        # Historical recovery tags predate this verifier and the three-package workspace.
        # Normal releases must contain the verifier; a missing script fails the step.
        if: needs.select.outputs.tag == '' || hashFiles('scripts/check-published.mjs') != ''
        timeout-minutes: 40
        run: node scripts/check-published.mjs
      - name: Create release for the existing tag
        if: needs.select.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.select.outputs.tag }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
      - name: Summarize publication
        if: always() && steps.publish.outcome != 'skipped'
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PUBLISHED_PACKAGES: ${{ steps.publish.outputs.published-packages }}
          REGISTRY_OUTCOME: ${{ steps.verify_registry.outcome || 'not-run' }}
        run: |
          {
            printf '### npm publication\n\n'
            printf 'Result: %s\n\n' "$PUBLISH_OUTCOME"
            printf 'Packages reported by Changesets: `%s`\n' "$PUBLISHED_PACKAGES"
            printf 'Exact registry versions and installed consumers: %s\n' "$REGISTRY_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
