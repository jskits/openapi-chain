name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: '0'
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  select:
    # Trusted Publishing is configured; RELEASE_ENABLED=false is an emergency stop.
    if: github.repository == 'jskits/openapi-chain' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      publish-plan: ${{ steps.select.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: select

  version:
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm version:packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'

  verify:
    needs: select
    if: needs.select.outputs.mode == 'publish'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  pack:
    needs: [select, verify]
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      packed: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Require the selected publish plan
        run: test -n "$PUBLISH_PLAN_ARTIFACT_ID"
        env:
          PUBLISH_PLAN_ARTIFACT_ID: ${{ needs.select.outputs.publish-plan }}
      - uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: pack
        with:
          publish-plan-artifact-id: ${{ needs.select.outputs.publish-plan }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      # Publish the packed artifact without running package lifecycle scripts.
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          # Do not set registry-url: OIDC needs no token-based .npmrc.
          package-manager-cache: false
      - name: Verify Trusted Publishing prerequisites
        shell: bash
        run: |
          # pnpm 10 delegates publishing tarballs to the npm CLI on PATH.
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = version.split('.').map(Number);
          if (!(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) {
            throw new Error(`npm >=11.5.1 is required for Trusted Publishing; found ${version}`);
          }
          for (const key of ['ACTIONS_ID_TOKEN_REQUEST_URL', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN', 'PACK_ARTIFACT_ID']) {
            if (!process.env[key]) throw new Error(`Missing ${key}`);
          }
          console.log(`Trusted Publishing prerequisites passed (npm ${version}).`);
          NODE
        env:
          PACK_ARTIFACT_ID: ${{ needs.pack.outputs.packed }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: publish
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.packed }}
          create-github-releases: true
          push-git-tags: true
      - name: Summarize publication
        if: always() && steps.publish.outcome != 'skipped'
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PUBLISHED_PACKAGES: ${{ steps.publish.outputs.published-packages }}
        run: |
          {
            printf '### npm publication\n\n'
            printf 'Result: %s\n\n' "$PUBLISH_OUTCOME"
            printf 'Packages reported by Changesets: `%s`\n' "$PUBLISHED_PACKAGES"
          } >> "$GITHUB_STEP_SUMMARY"
